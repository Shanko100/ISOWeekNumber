name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The Python the release builds use (build.yml); keep the two in step.
  PYTHON_VERSION: "3.15.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
      - name: Install dependencies
        run: python -m pip install --only-binary ":all:" -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  relay:
    # macOS, not Linux: the tests drive the app's own relay client, and the
    # app's platform layer only runs on Windows and macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          npm ci
          python -m pip install --only-binary ":all:" -r ../requirements-dev.txt
      - name: Type check
        run: npm run check
      - name: Online integration tests against a local relay
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 \
            --var CREATE_LIMIT:10000 --var LOBBIES_PER_CLIENT:10000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/v1/lobbies && break; sleep 1; done
          WEEKNUMBER_TZD_RELAY=http://127.0.0.1:8787 python -m pytest ../tests/test_tzd_relay.py
