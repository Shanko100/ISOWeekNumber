name: build-linux

# Builds WeekNumber for Linux, x64 and ARM64, from one statically linked
# executable (musl, static-pie) that runs on any distribution with no
# libraries to install:
#   WeekNumber-<version>-linux-<arch>.deb      Ubuntu, Linux Mint, Debian
#   WeekNumber-<version>-linux-<arch>.rpm      Fedora, openSUSE
#   WeekNumber-<version>-linux-<arch>.flatpak  Bazzite, SteamOS (Flatpak)
#   WeekNumber-<version>-linux-<arch>.AppImage the fallback (Arch and the rest),
#                                              which installs itself on a double-click
# (packaging/linux/make-appimage.sh, make-packages.sh; nfpm builds the .deb
# and .rpm). Start it by hand: Actions -> build-linux -> Run workflow. The
# files and their SHA-256 are attached to the run as downloads; nothing is
# committed. With "Create a draft release" ticked, a new draft release is
# made from .github/release-notes.md and the files are attached to it; its
# id (in the run summary) is what the other build workflows take to attach
# theirs.
#
# Each architecture builds natively and runs formatting, linting, unit
# tests (including a live D-Bus tray test), dependency auditing, binary and
# package checks, and a smoke test on a headless X server with a system
# tray. (UI tests on a full desktop: test-linux.yml.)

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release and attach the Linux files
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.20.2"
  NFPM_VERSION: "v2.47.0"

jobs:
  build:
    name: WeekNumber for Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools (X server, tray, D-Bus, fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb stalonetray openbox x11-utils xdotool imagemagick dbus \
            fonts-dejavu-core fonts-noto-core squashfs-tools flatpak rpm

      - name: Install nfpm (builds the .deb and .rpm)
        # From its Go module at a pinned version: the Go toolchain checks
        # every module it fetches against go.sum and the Go checksum
        # database. A build tool only; nothing of it goes into the packages.
        run: |
          if ! command -v go >/dev/null; then
            sudo apt-get install -y -q --no-install-recommends golang-go
          fi
          GOTOOLCHAIN=auto GOBIN="$RUNNER_TEMP/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --target "$TARGET" --no-self-update
          rustc --version --verbose
          cargo --version

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --target "$TARGET" --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --target "$TARGET"

      - name: Dependency audit (cargo-deny, RustSec advisories)
        if: matrix.arch == 'x64'
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo deny --locked check advisories bans licenses sources

      - name: Build the executable and the AppImage
        run: |
          cargo build --release --locked --target "$TARGET"
          version=$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' src/app.rs)
          test -n "$version"
          out="WeekNumber-$version-linux-$ARCH.AppImage"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "OUT=$out" >> "$GITHUB_ENV"
          mkdir -p dist
          packaging/linux/make-appimage.sh "target/$TARGET/release/WeekNumber" "dist/$out"

      - name: Build the .deb, .rpm and Flatpak bundle
        # From the same executable, with the Legal notices text build.rs
        # composed for it, so the packages ship what the app shows.
        run: |
          legal=$(ls -t target/"$TARGET"/release/build/weeknumber-*/out/legal.txt | head -1)
          test -s "$legal"
          packaging/linux/make-packages.sh "target/$TARGET/release/WeekNumber" "$legal" "$VERSION" "$ARCH" dist
          echo "PKG=WeekNumber-$VERSION-linux-$ARCH" >> "$GITHUB_ENV"
          echo "LEGAL=$legal" >> "$GITHUB_ENV"

      - name: Check the binary
        # Static-pie, no dynamic loader or libraries, full RELRO, a
        # non-executable stack, and no networking or TLS code inside; the
        # AppImage magic, and the payload where AppImage tools look for it.
        run: |
          f="dist/$OUT"
          file "$f"
          headers=$(readelf -lW "$f")
          dynamic=$(readelf -d "$f" || true)
          check() { if eval "$2"; then echo "| $1 | yes |"; else echo "| $1 | NO |"; fail=1; fi; }
          fail=0
          {
            echo "### Binary checks ($OUT)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            check "Static PIE" 'file "$f" | grep -q "static-pie linked"'
            check "No dynamic loader" '! grep -q INTERP <<<"$headers"'
            check "No shared libraries" '! grep -q NEEDED <<<"$dynamic"'
            check "Full RELRO" 'grep -q GNU_RELRO <<<"$headers" && grep -q BIND_NOW <<<"$dynamic"'
            check "Non-executable stack" 'grep GNU_STACK <<<"$headers" | grep -qv RWE'
            check "No TLS libraries" '! strings "$f" | grep -qiE "openssl|libssl|rustls"'
            check "AppImage type 2 magic" '[ "$(od -An -c -j8 -N3 "$f" | tr -d " ")" = "AI002" ]'
            check "AppImage payload (SquashFS) at the ELF end" 'unsquashfs -o "$("$f" --appimage-offset)" -l "$f" | grep -q "\.desktop$"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Check the packages
        # The same program and legal text in each; the license fields;
        # no dependencies or install scripts; the Flatpak's sandbox: the
        # X11 display and the tray watcher only, no network.
        run: |
          p="dist/$PKG"
          exe="target/$TARGET/release/WeekNumber"
          sum=$(sha256sum "$exe" | cut -d' ' -f1)
          legal_sum=$(sha256sum "$LEGAL" | cut -d' ' -f1)
          app_id=io.github.shanko100.weeknumber
          fp_files="$HOME/.local/share/flatpak/app/$app_id/current/active/files"
          flatpak install --user -y --noninteractive --no-deps --bundle "$p.flatpak" >/dev/null
          perms=$(flatpak info --user --show-permissions "$app_id")
          expected=$(printf '[Context]\nsockets=x11;\n\n[Session Bus Policy]\norg.kde.StatusNotifierWatcher=talk')
          deb_file() { dpkg-deb --fsys-tarfile "$p.deb" | tar -xO "./$1"; }
          check() { if eval "$2"; then echo "| $1 | yes |"; else echo "| $1 | NO |"; fail=1; fi; }
          fail=0
          {
            echo "### Package checks ($PKG)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            check ".deb: weeknumber $VERSION, no dependencies" '[ "$(dpkg-deb -f "$p.deb" Package)" = weeknumber ] && dpkg-deb -f "$p.deb" Version | grep -q "^$VERSION-" && [ -z "$(dpkg-deb -f "$p.deb" Depends Pre-Depends Recommends)" ]'
            check ".deb: no install scripts" '! dpkg-deb --ctrl-tarfile "$p.deb" | tar -t | grep -qE "inst|rm"'
            check ".deb: the program" '[ "$(deb_file usr/bin/weeknumber | sha256sum | cut -d" " -f1)" = "$sum" ]'
            check ".deb: copyright file and legal notices" 'deb_file usr/share/doc/weeknumber/copyright | grep -q "^License: MIT AND" && [ "$(deb_file usr/share/doc/weeknumber/LEGAL_NOTICES.txt | sha256sum | cut -d" " -f1)" = "$legal_sum" ]'
            check ".rpm: weeknumber $VERSION, License field" '[ "$(rpm -qp --qf "%{NAME} %{VERSION}" "$p.rpm")" = "weeknumber $VERSION" ] && rpm -qp --qf "%{LICENSE}" "$p.rpm" | grep -q "^MIT AND"'
            check ".rpm: no dependencies or install scripts" '! rpm -qpR "$p.rpm" | grep -qv "^rpmlib(" && [ -z "$(rpm -qp --scripts "$p.rpm")" ]'
            check ".rpm: the program and the legal notices" 'rpm -qp --dump "$p.rpm" | grep -q "^/usr/bin/weeknumber [0-9]* [0-9]* $sum " && rpm -qp --dump "$p.rpm" | grep -q "^/usr/share/licenses/weeknumber/LEGAL_NOTICES.txt [0-9]* [0-9]* $legal_sum " && rpm -qpL "$p.rpm" | grep -q /LICENSE'
            check "Flatpak: the program and the legal notices" '[ "$(sha256sum "$fp_files/bin/weeknumber" | cut -d" " -f1)" = "$sum" ] && cmp -s "$LEGAL" "$fp_files/share/licenses/$app_id/LEGAL_NOTICES.txt"'
            check "Flatpak: X11 and the tray watcher only, no network" '[ "$perms" = "$expected" ]'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          flatpak uninstall --user -y --noninteractive "$app_id" >/dev/null
          exit $fail

      - name: Smoke test (headless desktop with a system tray)
        # Starts the program as a desktop session would, with its own
        # config folder: it must stay up as one process, dock its icon in
        # the tray, write its settings, open the calendar, keep little
        # memory, and hand over to a second launch.
        run: |
          export DISPLAY=:99 HOME="$RUNNER_TEMP/home" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          # The runner image sets XDG_CONFIG_HOME; use the fresh home's.
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1600x900x24 >/dev/null 2>&1 &
          sleep 2
          openbox >/dev/null 2>&1 &
          stalonetray --geometry 4x1-0-0 --icon-size 24 --kludges force_icons_size -bg '#202020' >/dev/null 2>&1 &
          sleep 2
          exe="$PWD/dist/$OUT"
          export WEEKNUMBER_NO_INSTALL_PROMPT=1
          "$exe" &
          first=$!
          sleep 5
          kill -0 $first || { echo "WeekNumber exited after start"; exit 1; }
          count=$(pgrep -c -f "^$exe\$" || true)
          test "$count" -eq 1 || { echo "expected 1 process, found $count"; exit 1; }
          test -z "$(pgrep -P $first)" || { echo "child processes started"; exit 1; }
          grep -q '"StartupInitialized": true' "$HOME/.config/weeknumber/settings.json"
          xwininfo -root -tree | grep -i '"weeknumber"' || { echo "no tray icon window"; exit 1; }
          idle_kb=$(awk '/VmRSS/ {print $2}' /proc/$first/status)
          # Click the tray icon: the calendar opens.
          xdotool mousemove 1516 888 click 1
          sleep 2
          xwininfo -root -tree | grep -E '"WeekNumber".*[0-9]{3}x[0-9]{3}' || { echo "calendar did not open"; exit 1; }
          open_kb=$(awk '/VmRSS/ {print $2}' /proc/$first/status)
          xdotool key Escape
          sleep 1
          closed_kb=$(awk '/VmRSS/ {print $2}' /proc/$first/status)
          # A second launch takes over.
          "$exe" &
          second=$!
          sleep 4
          if kill -0 $first 2>/dev/null; then echo "the running copy did not hand over"; exit 1; fi
          kill -0 $second || { echo "the new launch exited"; exit 1; }
          kill $second
          {
            echo "### Smoke test ($OUT)"
            echo "Started, docked in the tray, opened and closed the calendar, wrote settings.json, handed over to a second launch."
            echo ""
            echo "| Idle RSS (KB) | Calendar open (KB) | After closing (KB) | Size (bytes) |"
            echo "|---|---|---|---|"
            echo "| $idle_kb | $open_kb | $closed_kb | $(stat -c %s "$exe") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checksum
        run: |
          cd dist
          for f in "$OUT" "$PKG.deb" "$PKG.rpm" "$PKG.flatpak"; do
            sha256sum "$f" | sed 's/  / */' > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.OUT }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.OUT }}.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.PKG }}.deb
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the .deb checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.PKG }}.deb.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the .rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.PKG }}.rpm
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the .rpm checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.PKG }}.rpm.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.PKG }}.flatpak
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the Flatpak bundle checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.PKG }}.flatpak.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: build
    if: inputs.draft_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create a new draft release and attach the Linux files
        # Always a new draft, never an existing release; the release's
        # tag is only created when the draft is published.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' src/app.rs)
          test -n "$version"
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$version" -f target_commitish="$GITHUB_SHA" \
            -f name="WeekNumber $version" -F draft=true \
            -F body=@.github/release-notes.md --jq .id)
          test -n "$id"
          .github/upload-to-draft.sh "$id"
          {
            echo "### Draft release"
            echo "New draft \`WeekNumber $version\` (id \`$id\`) with the Linux files."
            echo "To attach the other editions, run their build workflows with this id."
          } >> "$GITHUB_STEP_SUMMARY"
